<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>埼玉県第4種サッカーリーグ 順位表</title>
<meta name="description" content="埼玉県第4種(U-12)サッカーリーグ S1・S2および各地域リーグの最新順位・勝点・対戦成績を毎日更新">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#11213D">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="mast-inner">
    <div class="crest" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="40" height="40">
        <path d="M24 2 L42 9 V24 C42 35 34 43 24 46 C14 43 6 35 6 24 V9 Z"
              fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
        <circle cx="24" cy="23" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M24 2 V15 M24 31 V46 M6 16 H14 M34 16 H42" stroke="currentColor" stroke-width="2"/>
      </svg>
    </div>
    <div class="mast-text">
      <p class="kicker">埼玉県U-12サッカー連盟 第4種リーグ戦</p>
      <h1>順位・対戦成績ボード</h1>
    </div>
  </div>
  <p class="updated" id="updated">読み込み中…</p>
</header>

<div class="searchbar" id="searchWrap">
  <div class="search-field">
    <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M16.5 16.5 L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input type="search" id="search"
           placeholder="チーム名・リーグ名で探す"
           autocomplete="off" aria-label="チーム名・リーグ名で検索">
  </div>
  <p class="search-meta" id="searchMeta" hidden></p>
</div>

<main>
  <section id="hero" aria-label="県リーグ"></section>

  <nav class="tabs" id="tabs" aria-label="地域リーグ切替"></nav>

  <section id="leagues" aria-live="polite"></section>

  <section class="history" id="historySec">
    <h2>更新履歴</h2>
    <div id="history"></div>
  </section>
</main>

<footer>
  <p>データ出典: <a href="https://www.saitama-u12.com/league/" target="_blank" rel="noopener">埼玉県U-12サッカー連盟</a></p>
  <p class="note">公式サイト掲載のPDFを毎日自動で集計しています。順位・勝点・対戦成績は自動解析による参考値です。確定情報は各リーグの公式PDFをご確認ください。</p>
</footer>

<script src="app.js"></script>
</body>
</html>
